title: playlists
description: Definitions for playlists API
resources:
  playlists:
    get:
      operationId: playlists
      tags:
        - playlists
      summary: Returns all playlists available in Sofie.
      responses:
        200:
          description: Command successfully handled - returns an array of playlist Ids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 200
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/playlistItem'
                    example:
                      - id: 'OKAgZmZ0Buc99lE_2uPPSKVbMrQ_'
        500:
          $ref: '#/components/responses/internalServerError'
  activate:
    put:
      operationId: activate
      tags:
        - playlists
      summary: Activates a Playlist.
      parameters:
        - name: playlistId
          in: path
          description: Playlist to activate.
          required: true
          schema:
            type: string
      requestBody:
        description: Whether to activate into rehearsal mode.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rehearsal:
                  type: boolean
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: There is already an active Playlist for the studio that the Playlist belongs to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: Rundown Playlist is active, please deactivate before preparing it for broadcast
        500:
          $ref: '#/components/responses/internalServerError'
  deactivate:
    put:
      operationId: deactivate
      tags:
        - playlists
      summary: Deactivates a Playlist.
      parameters:
        - name: playlistId
          in: path
          description: Playlist to deactivate.
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        500:
          $ref: '#/components/responses/internalServerError'
  executeAdLib:
    post:
      operationId: executeAdLib
      tags:
        - playlists
      summary: Executes the requested AdLib/AdLib Action. This is a "planned" AdLib (Action) that has been produced by the blueprints during the ingest process.
      parameters:
        - name: playlistId
          in: path
          description: Playlist to execute adLib in.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adLibId:
                  type: string
                  description: AdLib to execute
                actionType:
                  type: string
                  description: An actionType string to specify a particular variation for the AdLibAction, valid strings are to be read from the status API
                adLibOptions:
                  type: object
                  description: AdLibAction options object defined according to the optionsSchema provided in the adLib status API
              required:
                - adLibId
              example:
                adLibId: adlib_action_camera
                actionType: pvw
      responses:
        200:
          $ref: '#/components/responses/executeActionSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active, there is not an on-air Part instance or an adLib for the provided `adLibId` cannot be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: AdLib could not be found!
        500:
          $ref: '#/components/responses/internalServerError'
  executeBucketAdLib:
    post:
      operationId: executeBucketAdLib
      tags:
        - playlists
      summary: Executes the requested Bucket AdLib/AdLib Action. This is a Bucket AdLib (Action) that has been previously inserted into a Bucket.
      parameters:
        - name: playlistId
          in: path
          description: Playlist to execute the Bucket AdLib in.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actionType:
                  type: string
                  description: An actionType string to specify a particular variation for the AdLibAction, valid strings are to be read from the status API
                bucketId:
                  type: string
                  description: Bucket to execute the adlib from
                externalId:
                  type: string
                  description: External Id of the Bucket AdLib to execute
              required:
                - bucketId
                - externalId
              example:
                bucketId: 6jZ6NvpoikxuXqcm4
                externalId: my_lower_third
                actionType: pvw
      responses:
        200:
          $ref: '#/components/responses/executeActionSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active, there is not an on-air Part instance or an adLib for the provided `externalId` cannot be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: AdLib could not be found!
        500:
          $ref: '#/components/responses/internalServerError'
  moveNextPart:
    post:
      operationId: moveNextPart
      tags:
        - playlists
      summary: Moves the next point by `delta` places. Negative values are allowed to move "backwards" in the script.
      parameters:
        - name: playlistId
          in: path
          description: Playlist to target.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta:
                  type: number
                  description: Amount to move next point by (+/-). If delta results in an index that is greater than the number of Parts available, no action will be taken.
              required:
                - delta
      responses:
        200:
          description: Command successfully handled - returns a string with the new PartID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 200
                  result:
                    type: string
                    example: '3Y9at66pZipxE8Kkn850LLV9Cz0_'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active or there is both no current or next Part.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: The selected part does not exist
        500:
          $ref: '#/components/responses/internalServerError'
  moveNextSegment:
    post:
      operationId: moveNextSegment
      tags:
        - playlists
      summary: Moves the next Segment point by `delta` places. Negative values are allowed to move "backwards" in the script.
      parameters:
        - name: playlistId
          in: path
          description: Playlist to target.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta:
                  type: number
                  description: Amount to move next Segment point by (+/-). If delta results in an index that is greater than the number of Segments available, no action will be taken.
                ignoreQuickLoop:
                  type: boolean
                  description: When true, the operation will ignore any boundaries set by the QuickLoop feature when moving to the next part
              required:
                - delta
      responses:
        200:
          description: Command successfully handled - returns a string with the new PartID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 200
                  result:
                    type: string
                    example: 'YjGd_1dWjta_E1ZuDaOczP1lsgk_'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active or there is both no current or next Part.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: The selected part does not exist
        500:
          $ref: '#/components/responses/internalServerError'
  reloadPlaylist:
    put:
      operationId: reloadPlaylist
      tags:
        - playlists
      summary: Reloads a Playlist from its ingest source (e.g. MOS/Spreadsheet etc.)
      parameters:
        - name: playlistId
          in: path
          description: Playlist to reload.
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        500:
          $ref: '#/components/responses/internalServerError'
  resetPlaylist:
    put:
      operationId: resetPlaylist
      tags:
        - playlists
      summary: Resets a Playlist back to its pre-played state.
      parameters:
        - name: playlistId
          in: path
          description: Playlist to reset.
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: The target Playlist is currently active (reset while on-air can be enabled in core settings).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: RundownPlaylist is active but not in rehearsal, please deactivate it or set in in rehearsal to be able to reset it.
        500:
          $ref: '#/components/responses/internalServerError'
  setNextPart:
    put:
      operationId: setNextPart
      tags:
        - playlists
      summary: Sets the next Part to a given PartId.
      parameters:
        - name: playlistId
          in: path
          description: Target playlist.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partId:
                  type: string
                  description: Part to set as next.
              required:
                - partId
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active, the specified Part does not exist, the specified Part is not playable, currently in hold, or the specified part is not playable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: The selected part does not exist
        500:
          $ref: '#/components/responses/internalServerError'
  setNextSegment:
    post:
      operationId: setNextSegment
      tags:
        - playlists
      summary: Sets the next part to the first playable Part of the Segment with given segmentId.
      parameters:
        - name: playlistId
          in: path
          description: Target playlist.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segmentId:
                  type: string
                  description: Segment to set as next.
                  example: 'n1mOVd5_K5tt4sfk6HYfTuwumGQ_'
              required:
                - segmentId
      responses:
        200:
          description: Command successfully handled - returns Part ID if the first part of a segment was set as next.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 200
                  result:
                    type: string
                    example: '3Y9at66pZipxE8Kkn850LLV9Cz0_'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active, the specified Segment does not exist, the specified Segment does not contain any playable parts, or currently in hold.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: The selected part does not exist
        500:
          $ref: '#/components/responses/internalServerError'
  queueNextSegment:
    post:
      operationId: queueNextSegment
      tags:
        - playlists
      summary: Queue Segment with a given segmentId, so that the Next point will jump to that Segment when reaching the end of the currently playing Segment. If the part currently set as next is outside of the current segment, it will set the first part of the given segment as next.
      parameters:
        - name: playlistId
          in: path
          description: Target playlist.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segmentId:
                  type: string
                  description: Segment to queue.
                  example: 'n1mOVd5_K5tt4sfk6HYfTuwumGQ_'
              required:
                - segmentId
      responses:
        200:
          description: Command successfully handled - returns ID of the queued Segment, or ID of the Part set as next.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 200
                  result:
                    type: object
                    oneOf:
                      - properties:
                          queuedSegmentId:
                            type: string
                            nullable: true
                            description: Segment ID, when a segment was queued, or 'null' when previously queued segment is cleared.
                            example: 'n1mOVd5_K5tt4sfk6HYfTuwumGQ_'
                      - properties:
                          nextPartId:
                            type: string
                            description: Part ID, when a part was set as next.
                            example: '3Y9at66pZipxE8Kkn850LLV9Cz0_'

        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active, the specified Segment does not exist, the specified Segment does not contain any playable parts, or currently in hold.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: The selected part does not exist
        500:
          $ref: '#/components/responses/internalServerError'
  take:
    post:
      operationId: take
      tags:
        - playlists
      summary: Performs a take in the given Playlist.
      parameters:
        - name: playlistId
          in: path
          description: Target playlist.
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fromPartInstanceId:
                  type: string
                  description: May be specified to ensure that multiple take requests from the same Part do not result in multiple takes.
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Specified Playlist is not active or specified Playlist does not have a next Part.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: No Next point found, please set a part as Next before doing a TAKE.
        500:
          $ref: '#/components/responses/internalServerError'

  clearSourceLayers:
    put:
      operationId: clearSourceLayers
      tags:
        - playlists
      summary: Clears the target SourceLayers.
      parameters:
        - name: playlistId
          in: path
          description: Target playlist.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceLayerIds:
                  description: Target SourceLayers.
                  type: array
                  items:
                    type: string
              required:
                - sourceLayerIds
              example:
                sourceLayerIds:
                  - 'mySourceLayerId'
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Playlist is not active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: Rundown must be active!
        500:
          $ref: '#/components/responses/internalServerError'

  sourceLayer:
    delete:
      deprecated: true
      operationId: clearSourceLayer
      tags:
        - sourceLayers
      summary: |
        Clears the target SourceLayer.
        This endpoint is deprecated, use the `clear-sourcelayers` endpoint instead.
      parameters:
        - name: playlistId
          in: path
          description: Target playlist.
          required: true
          schema:
            type: string
        - name: sourceLayerId
          in: path
          description: Target SourceLayer.
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/putSuccess'
        404:
          $ref: '#/components/responses/playlistNotFound'
        412:
          description: Playlist is not active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    example: 412
                  message:
                    type: string
                    example: Rundown must be active!
        500:
          $ref: '#/components/responses/internalServerError'
    sticky:
      post:
        operationId: recallSticky
        tags:
          - sourceLayers
        summary: Recalls the last sticky Piece on the specified SourceLayer, if there is any.
        parameters:
          - name: playlistId
            in: path
            description: Target playlist.
            required: true
            schema:
              type: string
          - name: sourceLayerId
            in: path
            description: Target sourcelayer.
            required: true
            schema:
              type: string
        responses:
          200:
            $ref: '#/components/responses/putSuccess'
          404:
            $ref: '#/components/responses/playlistNotFound'
          412:
            description: Playlist is not active, SourceLayer is not sticky, or there is no sticky piece for this SourceLayer.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    status:
                      type: number
                      example: 412
                    message:
                      type: string
                      example: Rundown must be active!
          500:
            $ref: '#/components/responses/internalServerError'

components:
  schemas:
    playlistItem:
      type: object
      properties:
        id:
          type: string
        externalId:
          type: string
      required:
        - id
        - externalId
      additionalProperties: false
    playlist:
      type: object
      title: ActivePlaylistEvent
      properties:
        id:
          description: Unique id of the active playlist
          oneOf:
            - type: string
            - type: 'null'
        name:
          description: User-presentable name for the active playlist
          type: string
        rundownIds:
          description: The set of rundownIds in the active playlist, in order
          type: array
          items:
            type: string
        currentPart:
          description: The current Part - if empty, no part in the active playlist is live
          $ref: '#/components/schemas/currentPart'
        currentSegment:
          description: The Segment of the current Part - if empty, no part in the active playlist is live
          $ref: '#/components/schemas/currentSegment'
        nextPart:
          description: The next Part - if empty, no part will follow live part
          $ref: '#/components/schemas/part'
        publicData:
          description: Optional arbitrary data
        timing:
          description: Timing information about the active playlist
          type: object
          title: ActivePlaylistTiming
          properties:
            timingMode:
              description: 'Timing mode for the playlist.'
              type: string
              title: ActivePlaylistTimingMode
              enum:
                - none
                - forward-time
                - back-time
            startedPlayback:
              description: Unix timestamp of when the playlist started (milliseconds)
              type: number
            expectedStart:
              description: Unix timestamp of when the playlist is expected to start (milliseconds). Required when the timingMode is set to forward-time.
              type: number
            expectedDurationMs:
              description: Duration of the playlist in ms
              type: number
            expectedEnd:
              description: Unix timestamp of when the playlist is expected to end (milliseconds) Required when the timingMode is set to back-time.
              type: number
          required: [timingMode]
          additionalProperties: false
        quickLoop:
          description: Information about the current quickLoop, if any
          type: object
          title: ActivePlaylistQuickLoop
          properties:
            locked:
              description: Whether the user is allowed to make alterations to the Start/End markers
              type: boolean
            running:
              description: Whether the loop has two valid markers and is currently running
              type: boolean
            start:
              description: The start of the loop
              $ref: '#/components/schemas/quickLoopMarker'
            end:
              description: The end of the loop
              $ref: '#/components/schemas/quickLoopMarker'
          required: [locked, running]
      required: [id, name, rundownIds, currentPart, currentSegment, nextPart, timing]
      additionalProperties: false
      examples:
        - id: 'OKAgZmZ0Buc99lE_2uPPSKVbMrQ_'
          name: 'Playlist 0'
          rundownIds: ['y9HauyWkcxQS3XaAOsW40BRLLsI_']
          currentPart:
            $ref: '#/components/schemas/currentPart/examples/0'
          currentSegment:
            $ref: '#/components/schemas/currentSegment/examples/0'
          nextPart:
            $ref: '#/components/schemas/part/examples/0'
          publicData:
            category: 'Evening News'
          timing:
            timingMode: 'forward-time'
            expectedStart: 1728895750727
            expectedDurationMs: 180000
    partBase:
      type: object
      title: PartStatus
      properties:
        id:
          description: Unique id of the part
          type: string
        name:
          description: User name of the part
          type: string
        segmentId:
          description: Unique id of the segment this part belongs to
          type: string
        autoNext:
          description: If this part will progress to the next automatically
          type: boolean
          default: false
        pieces:
          description: All pieces in this part
          type: array
          items:
            $ref: '#/components/schemas/piece'
        publicData:
          description: Optional arbitrary data
      required: [id, name, segmentId, pieces]
      # additionalProperties: false
      examples:
        - id: 'H5CBGYjThrMSmaYvRaa5FVKJIzk_'
          name: 'Intro'
          segmentId: 'n1mOVd5_K5tt4sfk6HYfTuwumGQ_'
          autoNext: false
          pieces:
            - $ref: '#/components/schemas/piece/examples/0'
          publicData:
            partType: 'intro'
    currentSegmentPart:
      type: object
      title: CurrentSegmentPart
      properties:
        id:
          description: Unique id of the part
          type: string
        name:
          description: User-presentable name of the part
          type: string
        autoNext:
          description: If this part will progress to the next automatically
          type: boolean
          default: false
        timing:
          type: object
          title: CurrentSegmentPartTiming
          properties:
            expectedDurationMs:
              description: Expected duration of the part
              type: number
      required: [id, name, timing]
      additionalProperties: false
      examples:
        - id: 'H5CBGYjThrMSmaYvRaa5FVKJIzk_'
          name: 'Intro'
          timing:
            expectedDurationMs: 15000
    part:
      oneOf:
        - $ref: '#/components/schemas/partBase'
        - type: 'null'
      examples:
        - id: 'H5CBGYjThrMSmaYvRaa5FVKJIzk_'
          name: 'Intro'
          segmentId: 'n1mOVd5_K5tt4sfk6HYfTuwumGQ_'
          autoNext: false
          pieces:
            - $ref: '#/components/schemas/piece/examples/0'
    currentPart:
      oneOf:
        - title: CurrentPartStatus
          allOf:
            - $ref: '#/components/schemas/partBase'
            - type: object
              properties:
                timing:
                  description: Timing information about the current part
                  type: object
                  title: CurrentPartTiming
                  properties:
                    startTime:
                      description: Unix timestamp of when the part started (milliseconds)
                      type: number
                    expectedDurationMs:
                      description: Expected duration of the part (milliseconds)
                      type: number
                    projectedEndTime:
                      description: Unix timestamp of when the part is projected to end (milliseconds). A sum of `startTime` and `expectedDurationMs`.
                      type: number
                  required: [startTime, expectedDurationMs, projectedEndTime]
              required: [timing]
        - type: 'null'
      examples:
        - id: 'H5CBGYjThrMSmaYvRaa5FVKJIzk_'
          name: 'Intro'
          segmentId: 'n1mOVd5_K5tt4sfk6HYfTuwumGQ_'
          autoNext: false
          timing:
            startTime: 1600000060000
            expectedDurationMs: 15000
            projectedEndTime: 1600000075000
          pieces:
            - $ref: '#/components/schemas/piece/examples/0'
          publicData:
            partType: 'intro'
    currentSegment:
      oneOf:
        - type: object
          title: CurrentSegment
          properties:
            id:
              description: Unique id of the segment
              type: string
            timing:
              description: Timing information about the current segment
              type: object
              title: CurrentSegmentTiming
              properties:
                expectedDurationMs:
                  description: Expected duration of the segment
                  type: number
                budgetDurationMs:
                  description: Budget duration of the segment
                  type: number
                projectedEndTime:
                  description: Unix timestamp of when the segment is projected to end (milliseconds). The time this segment started, offset by its budget duration, if the segment has a defined budget duration. Otherwise, the time the current part started, offset by the difference between expected durations of all parts in this segment and the as-played durations of the parts that already stopped.
                  type: number
                countdownType:
                  description: 'Countdown type within the segment. Default: `part_expected_duration`'
                  type: string
                  title: SegmentCountdownType
                  enum:
                    - part_expected_duration
                    - segment_budget_duration
              required: [expectedDurationMs, projectedEndTime]
            parts:
              type: array
              items:
                $ref: '#/components/schemas/currentSegmentPart'
          required: [id, timing, parts]
          additionalProperties: false
        - type: 'null'
      examples:
        - id: 'H5CBGYjThrMSmaYvRaa5FVKJIzk_'
          timing:
            expectedDurationMs: 15000
            budgetDurationMs: 20000
            projectedEndTime: 1600000075000
            countdownType: segment_budget_duration
          parts:
            - $ref: '#/components/schemas/currentSegmentPart/examples/0'
    piece:
      type: object
      title: PieceStatus
      properties:
        id:
          description: Unique id of the Piece
          type: string
        name:
          description: User-facing name of the Piece
          type: string
        sourceLayer:
          description: The source layer name for this Piece
          type: string
        outputLayer:
          description: The output layer name for this Piece
          type: string
        tags:
          description: Tags attached to this Piece
          type: array
          items:
            type: string
        publicData:
          description: Optional arbitrary data
      required: [id, name, sourceLayer, outputLayer]
      additionalProperties: false
      examples:
        - id: 'H5CBGYjThrMSmaYvRaa5FVKJIzk_'
          name: 'Camera 1'
          sourceLayer: 'Camera'
          outputLayer: 'PGM'
          tags: ['camera']
          publicData:
            switcherSource: 1
    quickLoopMarker:
      type: object
      title: QuickLoopMarker
      properties:
        markerType:
          description: The type of entity the marker is locked to
          title: QuickLoopMarkerType
          type: string
          enum:
            - playlist
            - rundown
            - segment
            - part
        rundownId:
          description: The rundown that this marker references. This will be set for rundown, segment and part markers
          type: string
        segmentId:
          description: The segment that this marker references. This will be set for segment and part markers
          type: string
        partId:
          description: The part that this marker references. This will be set for only part markers
          type: string
      required: [markerType]
  # END OF PLAYLIST SCHEMAS
  responses:
    putSuccess:
      description: Action successfully sent
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
    executeActionSuccess:
      description: Command successfully handled - returns an object that informs whether a part was queued by the action and/or if the next part was automatically taken
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 200
              result:
                type: object
                properties:
                  queuedPartInstanceId:
                    type: string
                    example: 'YjGd_1dWjta_E1ZuDaOczP1lsgk_'
                  taken:
                    type: boolean
                    example: false
    playlistNotFound:
      description: The specified Playlist does not exist.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 404
              message:
                type: string
                example: The specified Playlist was not found
    internalServerError:
      description: An error unlikely to be the fault of the caller has occurred.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: number
                example: 500
              message:
                type: string
                example: Internal Server Error
