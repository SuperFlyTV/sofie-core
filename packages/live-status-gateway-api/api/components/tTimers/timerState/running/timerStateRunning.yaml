$defs:
  timerStateRunning:
    type: object
    title: TimerStateRunning
    description: Timer state when running (progressing with real time)
    properties:
      paused:
        type: boolean
        const: false
        description: Whether the timer is paused
      zeroTime:
        type: number
        description: >-
          Unix timestamp (ms) when the timer reaches/reached zero.
          For countdown timers, this is when time runs out.
          For free-run timers, this is when the timer started.
          Client calculates current value relative to this timestamp.
      pauseTime:
        description: >-
          Optional timestamp when the timer should automatically pause
          (e.g., when current part ends and overrun begins).
        oneOf:
          - type: number
          - type: 'null'
      resumesAt:
        description: >-
          Not applicable while running - a running timer has no scheduled start.
          Always null when present.
        # TODO: this should be `type: 'null'`, which is what is actually produced and is what
        # consumers should rely on. It is widened here only because the type generator (modelina)
        # renders a null-only property as `any`, which is worse for consumers of the generated
        # types than a slightly loose schema. Tighten once the generator can express it.
        oneOf:
          - type: number
          - type: 'null'
    required: [paused, zeroTime]
    additionalProperties: false
    examples:
      - $ref: './timerStateRunning-example.yaml'
