title: Rundowns
description: Rundowns schema for websocket subscriptions
$defs:
  rundowns:
    type: object
    title: RudnownsEvent
    properties:
      event:
        type: string
        const: rundowns
      rundownPlaylistId:
        description: Unique id of the rundown playlist, or null if no playlist is active
        oneOf:
          - type: string
          - type: 'null'
      rundowns:
        description: The rundowns that are in the currently active rundown playlist, in order
        type: array
        items:
          $ref: '#/$defs/rundown'
    required: [event, rundownPlaylistId, rundowns]
    additionalProperties: false
    examples:
      - event: segments
        rundownPlaylistId: 'OKAgZmZ0Buc99lE_2uPPSKVbMrQ_'
        rundowns:
          $ref: '#/$defs/rundown/examples'
  rundown:
    type: object
    title: Rundown
    properties:
      id:
        description: Unique id of the rundown
        type: string
      name:
        description: Name of the rundown
        type: string
      description:
        description: Longer user-presentable description of the rundown
        type: string
      timing:
        description: Timing information about the rundown
        $ref: 'timing/rundownPlaylistTiming.yaml#/$defs/rundownPlaylistTiming'
      publicData:
        description: Optional arbitrary data
      endOfRundownIsShowBreak:
        description: Whether the end of the rundown marks a commercial break
        type: boolean
      segments:
        description: The segments that in the rundown
        type: array
        items:
          $ref: 'segments.yaml#/$defs/extendedSegment'
    required: [id, name, segments]
    additionalProperties: false
    examples:
      - id: 'OKAgZmZ0Buc99lE_2uPPSKVbMrQ_'
        name: 'Example Rundown'
        description: 'Rundown description: Longer user-presentable description of the rundown'
        timing:
          timingMode: 'forward-time'
          expectedStart: 1728895750727
          expectedDurationMs: 180000
        publicData:
          containsLiveSource: true
        segments:
          $ref: 'segments.yaml#/$defs/extendedSegment/examples'
